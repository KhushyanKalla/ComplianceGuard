<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComplianceGuard</title>
    <script src="https://unpkg.com/tailwindcss-cdn@3.4.1/tailwindcss.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'IBM Plex Sans', sans-serif; }
        .mono { font-family: 'IBM Plex Mono', monospace; }
    </style>
</head>

<!-- Dark navy background for the whole page -->
<body class="bg-gray-950 text-gray-100 min-h-screen">

    <!-- Top navigation bar -->
    <nav class="border-b border-gray-800 bg-gray-900 px-6 py-4">
        <div class="max-w-6xl mx-auto flex items-center justify-between">

            <!-- Brand name on the left -->
            <span class="mono text-blue-400 font-semibold tracking-tight text-lg">
                ⬡ ComplianceGuard
            </span>

            <!-- Navigation links on the right -->
            <div class="flex gap-6 text-sm">
                <a href="/upload/" class="text-gray-400 hover:text-white transition-colors duration-200">
                    Upload
                </a>
                <a href="/dashboard/" class="text-gray-400 hover:text-white transition-colors duration-200">
                    Dashboard
                </a>
            </div>
        </div>
    </nav>

    <!-- Main content area — each page fills this block -->
    <main class="max-w-6xl mx-auto px-6 py-10">
        {% block content %}
        {% endblock content %}
    </main>

</body>
</html>
